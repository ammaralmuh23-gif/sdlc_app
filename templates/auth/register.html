{% extends "base.html" %}
{% block title %}حساب جديد{% endblock %}
{% block content %}
<h1>إنشاء حساب جديد</h1>

<form method="post" class="form-box">
    <label for="username">اسم المستخدم *</label>
    <input type="text" id="username" name="username" required minlength="3" autofocus>

    <label for="password">كلمة السر *</label>
    <div class="password-container">
        <input type="password" id="password" name="password" required minlength="6">
        <!-- تم إضافة this لتمرير الزر إلى الدالة -->
        <button type="button" class="toggle-password" onclick="togglePassword('password', this)">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
        </button>
    </div>

    <label for="confirm">تأكيد كلمة السر *</label>
    <div class="password-container">
        <input type="password" id="confirm" name="confirm" required minlength="6">
        <!-- تم إضافة this لتمرير الزر إلى الدالة -->
        <button type="button" class="toggle-password" onclick="togglePassword('confirm', this)">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
        </button>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn">إنشاء الحساب</button>
        <a href="{{ url_for('auth.login') }}" class="btn btn-secondary">عندي حساب</a>
    </div>
</form>
{% endblock %}
